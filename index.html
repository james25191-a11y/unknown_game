<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Untitled Game</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

  canvas{display:block;width:100%;height:100%}
  #hp{position:fixed;left:12px;top:12px;width:170px;height:14px;background:rgba(0,0,0,.45);

      text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none}
  #hpfill{position:absolute;inset:0 auto 0 0;width:100%;background:#4caf50}
  #hptxt{position:relative;padding-left:6px}
  #flash{position:fixed;inset:0;background:#c00;opacity:0;pointer-events:none}
  #dead{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
        gap:22px;background:rgba(150,10,10,.8);color:#fff;font:600 32px system-ui,sans-serif;
        text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #dead.show{display:flex}
  #respawn{font:600 16px system-ui,sans-serif;padding:10px 28px;border:2px solid #fff;border-radius:4px;
           background:rgba(0,0,0,.35);color:#fff;cursor:pointer}
  #respawn:hover{background:rgba(0,0,0,.6)}
  #wpn{position:fixed;left:12px;top:32px;font:600 11px system-ui,sans-serif;color:#fff;
       text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none}
  #prompt{position:fixed;left:0;right:0;bottom:22%;display:none;text-align:center;pointer-events:none;
          font:600 14px system-ui,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}

  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:26px;background:linear-gradient(#2f6fbf,#8fc8ee 70%,#bfe3c0);
         font-family:system-ui,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
  #start h1{margin:0;font-size:44px;font-weight:700;letter-spacing:.02em}

  .sv .nm{flex:1;min-width:0;font:600 16px system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sv .nm small{display:block;font:500 12px system-ui,sans-serif;opacity:.8}
  .sv button,#newgame,#savesback{font:600 14px system-ui,sans-serif;padding:7px 14px;border:2px solid #fff;border-radius:6px;background:rgba(0,0,0,.3);color:#fff;cursor:pointer}

          background:rgba(0,0,0,.6);color:#fff;outline:none}
  #chatin.show{display:block}
  #mpinfo{position:fixed;left:12px;top:48px;font:600 11px system-ui,sans-serif;color:#fff;
          text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none;display:none}
  .ptag{position:fixed;transform:translate(-50%,-100%);font:600 11px system-ui,sans-serif;color:#fff;

        border-radius:2px;overflow:hidden;pointer-events:none;display:none}
  .mbar i{display:block;height:100%;width:100%;background:#d33}

<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hp"><div id="hpfill"></div><span id="hptxt">100</span></div>

<div id="start"><h1>Untitled Game</h1>
  <div id="saves"><div id="savelist"></div><div class="mprow"><button id="newgame">+ New game</button><button id="savesback">Back</button></div></div>

  <div id="pmain"><button id="pback">Back to game</button><br><br><button id="pbinds">Settings</button><br><br><button id="pmenu">Return to menu</button></div>

<script>
// ============================================================================
// MULTIPLAYER SETTINGS - fill these in to connect players directly (WebRTC)
// using Firebase for signalling and your STUN/TURN servers for the connection.
// Leave them as they are to use the built-in room instead (signed-in users only).
// ============================================================================
const FIREBASE_CONFIG = {
  apiKey:      "AIzaSyAehbXPvnnEEINIoTtnz7roQ7slAtaFv7Y",
  authDomain:  "game-multiplayer-t.firebaseapp.com",
  databaseURL: "https://game-multiplayer-t-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:   "game-multiplayer-t",
  appId:       "1:894585457467:web:e329d7cde50093df86451e",
};
const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },                      // free public STUN
  { urls: ["turn:free.expressturn.com:3478?transport=udp",
           "turn:free.expressturn.com:3478?transport=tcp"],
    username: "000000002110273354", credential: "f4I2AmopTjaQh3ZmPlw0tW8JyIc=" },
];
const FORCE_TURN_RELAY = false;   // true = send everything through TURN (handy for testing it works)
// ---------------------------------------------------------------------------
// Terrain: a tiling heightmap generated here in JS. The same data is uploaded
// to the GPU for drawing and read by the physics, so what you see is what you
// stand on. The world repeats every PERIOD metres, so it never ends.
// ---------------------------------------------------------------------------
const PERIOD = 1536, N = 1024, CELL = PERIOD / N;

function hash2(ix, iz){
  let n = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function pnoise(x, z, cells, seed){
  const u = x / PERIOD * cells, v = z / PERIOD * cells;
  const iu = Math.floor(u), iv = Math.floor(v);
  let fu = u - iu, fv = v - iv;
  fu = fu*fu*(3 - 2*fu); fv = fv*fv*(3 - 2*fv);
  const a = ((iu % cells) + cells) % cells, b = (a + 1) % cells;
  const c = ((iv % cells) + cells) % cells, d = (c + 1) % cells;
  const s = seed * 7919;
  const n00 = hash2(a+s, c), n10 = hash2(b+s, c), n01 = hash2(a+s, d), n11 = hash2(b+s, d);
  const x0 = n00 + (n10 - n00)*fu, x1 = n01 + (n11 - n01)*fu;
  return x0 + (x1 - x0)*fv;
}
function fbm(x, z, cells, oct, seed){
  let sum = 0, amp = 0.5, norm = 0;
  for(let i = 0; i < oct; i++){
    sum += pnoise(x, z, cells << i, seed + i) * amp; norm += amp; amp *= 0.5;
  }
  return sum / norm;
}
function ridged(x, z, cells, oct, seed){
  let sum = 0, amp = 0.5, norm = 0;
  for(let i = 0; i < oct; i++){
    const q = 2*pnoise(x, z, cells << i, seed + i) - 1;
    const r = 1 - Math.sqrt(q*q + 0.03);   // soft crest instead of a razor crease
    sum += r*amp; norm += amp; amp *= 0.5;
  }
  return sum / norm;
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a)/(b - a), 0), 1); return t*t*(3 - 2*t); };

let lastRock = 0;   // height contributed by rock outcrops at the last sample

// scattered boulders / outcrops jutting from the ground (one candidate per 24 m cell)
function rocks(x, z){
  const RC = 64, cs = PERIOD / RC;
  const cx = Math.floor(x/cs), cz = Math.floor(z/cs);
  let best = 0;
  for(let i = -1; i <= 1; i++) for(let j = -1; j <= 1; j++){
    const ix = cx + i, iz = cz + j;
    const wi = ((ix % RC) + RC) % RC, wj = ((iz % RC) + RC) % RC;
    if(hash2(wi + 500, wj) < 0.5) continue;
    const px = (ix + 0.15 + 0.7*hash2(wi + 600, wj)) * cs;
    const pz = (iz + 0.15 + 0.7*hash2(wi + 700, wj)) * cs;
    const q  = hash2(wi + 800, wj);
    const rad = 1.8 + 4.2*q*q;
    const dx = x - px, dz = z - pz;
    const d2 = (dx*dx + dz*dz) / (rad*rad);
    if(d2 >= 1) continue;
    const hgt = (0.8 + 3.2*q) * Math.pow(1 - d2, 0.55) * (0.6 + 0.8*pnoise(x, z, 512, 9));
    if(hgt > best) best = hgt;
  }
  return best;
}

let lastWater = -1000, lastFx = 0, lastFz = 0;   // river water level (-1000 = none) and flow direction

// smooth large-scale shape: broad swells, valleys, mountains
function lowLevel(x, z){
  const dx = x - PERIOD*Math.round(x/PERIOD), dz = z - PERIOD*Math.round(z/PERIOD);
  const r = Math.hypot(dx, dz);
  const swell = (fbm(x, z, 8, 3, 1) - 0.5)*22;
  // mountains rise in a broken ring around the start; the start itself is meadow
  const ring  = sstep(80, 230, r);
  const clump = sstep(0.30, 0.50, fbm(x, z, 3, 2, 3));
  const mask  = ring * (0.3 + 0.7*clump);
  const shape = sstep(0.64, 0.88, ridged(x, z, 6, 3, 4));
  const foot  = ring * (fbm(x, z, 5, 3, 5) - 0.2) * 28;
  // valleys: winding channels with a flat floor and sloping walls; they also cut passes through the mountains
  const vd = Math.abs(fbm(x, z, 4, 3, 20) - 0.5);
  const vwarp = (pnoise(x, z, 24, 21) - 0.5) * 0.012;          // wobble the walls so they aren't uniform
  const valley = 1 - sstep(0.012, 0.075, vd + vwarp);
  return swell - valley*11 + (mask*shape*120 + foot) * (1 - 0.9*valley);
}

// mid-size lumps, small bumps, hollows and terraces
function detail(x, z){
  let h = (fbm(x, z, 24, 2, 2) - 0.5)*7 + (fbm(x, z, 96, 2, 6) - 0.5)*1.6;
  // hollows: round indents with sloping sides
  h -= 4.5 * sstep(0.60, 0.78, pnoise(x, z, 20, 7)) * (0.6 + 0.4*pnoise(x, z, 64, 8));
  // terraced ground: flat shelves joined by slanted risers, in some regions
  const tmask = sstep(0.42, 0.62, fbm(x, z, 3, 2, 10));
  const s = (fbm(x, z, 14, 2, 11) - 0.5) * 20;
  const fl = Math.floor(s);
  return h + tmask * 1.3 * (fl + sstep(0.30, 0.70, s - fl));
}

const RV_CORE = 1.5, RV_EDGE = 7;     // metres from the river's centre line: full depth inside, dry bank beyond

function terrainH(x, z){
  const dx = x - PERIOD*Math.round(x/PERIOD), dz = z - PERIOD*Math.round(z/PERIOD);
  const r = Math.hypot(dx, dz);
  const low = lowLevel(x, z), base = low + detail(x, z);

  // a river of fairly constant width runs along the centre line of every valley
  let prof = 0, h = base, gx = 0, gz = 0;
  lastWater = -1000; lastFx = 0; lastFz = 0;
  const s0 = fbm(x, z, 4, 3, 20) - 0.5;
  if(Math.abs(s0) < 0.06){
    const e = 2;
    gx = fbm(x + e, z, 4, 3, 20) - fbm(x - e, z, 4, 3, 20);
    gz = fbm(x, z + e, 4, 3, 20) - fbm(x, z - e, 4, 3, 20);
    const gl = Math.hypot(gx, gz) || 1e-6;
    const dist = Math.abs(s0) / (gl/(2*e));                    // approximate distance to the centre line, metres
    prof = 1 - sstep(RV_CORE, RV_EDGE, dist);
    if(prof > 0){
      const wl = low - 1.0;                                    // smooth water level that follows the valley floor
      h = base + (wl - 2.4 - base) * prof;                     // carve the river bed
      if(prof > 0.1){
        lastWater = wl;
        let tx = -gz/gl, tz = gx/gl;                           // along the channel
        const dlow = lowLevel(x + tx*25, z + tz*25) - lowLevel(x - tx*25, z - tz*25);
        if(Math.abs(dlow) > 0.15 ? dlow > 0 : tx < 0){ tx = -tx; tz = -tz; }   // flow downhill
        lastFx = tx; lastFz = tz;
      }
    }
  }

  // rock outcrops (kept off the spawn point and out of the river)
  lastRock = rocks(x, z) * sstep(8, 18, r) * (1 - sstep(0.03, 0.25, prof));
  return h + lastRock;
}

const heights = new Float32Array(N*N*4);   // [height, rock, water level, spare] per texel
const flowDir = new Float32Array(N*N*2);   // river flow direction per texel
let maxH = 0;
for(let j = 0; j < N; j++){
  for(let i = 0; i < N; i++){
    const h = terrainH(i*CELL, j*CELL);
    const q = (j*N + i)*4;
    heights[q] = h; heights[q+1] = lastRock; heights[q+2] = lastWater;
    flowDir[(j*N + i)*2] = lastFx; flowDir[(j*N + i)*2 + 1] = lastFz;
    if(h > maxH) maxH = h;
  }
}

function bilerp(arr, stride, off, x, z){
  const fx = x / CELL, fz = z / CELL;
  const ix = Math.floor(fx), iz = Math.floor(fz);
  const ax = fx - ix, az = fz - iz;
  const i0 = ix & (N-1), i1 = (ix + 1) & (N-1);
  const j0 = iz & (N-1), j1 = (iz + 1) & (N-1);
  const a = arr[(j0*N + i0)*stride + off], b = arr[(j0*N + i1)*stride + off];
  const c = arr[(j1*N + i0)*stride + off], d = arr[(j1*N + i1)*stride + off];
  const t0 = a + (b - a)*ax, t1 = c + (d - c)*ax;
  return t0 + (t1 - t0)*az;
}
const heightAt = (x, z) => bilerp(heights, 4, 0, x, z);
const waterLevelAt = (x, z) => bilerp(heights, 4, 2, x, z);          // -1000 = no river here
const waterDepthAt = (x, z) => Math.max(0, waterLevelAt(x, z) - heightAt(x, z));
const flowAt = (x, z) => [bilerp(flowDir, 2, 0, x, z), bilerp(flowDir, 2, 1, x, z)];
// where you actually stand: the river bed, or just below the surface when the water is deep (you wade / float)
function groundAt(x, z){
  const h = heightAt(x, z), w = waterLevelAt(x, z);
  return (w - h > 0.25) ? Math.max(h, w - 1.0) : h;
}

// ---- swords stabbed into the highest peaks ----
const SWORD_TYPES = {
  steel: {name: 'Steel Sword',       dmg: 42, blade: [0.80,0.84,0.90], guard: [0.55,0.58,0.64]},
  iron:  {name: 'Iron Sword',        dmg: 34, blade: [0.42,0.44,0.48], guard: [0.30,0.31,0.34]},
  stone: {name: 'Stone Sword',       dmg: 26, blade: [0.52,0.50,0.46], guard: [0.40,0.38,0.35]},
  wood:  {name: 'Wooden Sword',      dmg: 22, blade: [0.58,0.40,0.22], guard: [0.42,0.28,0.15]},
  rust:  {name: 'Rusted Iron Sword', dmg: 28, blade: [0.52,0.29,0.16], guard: [0.38,0.22,0.13]},
};
const SWORD_KEYS = Object.keys(SWORD_TYPES);
const worldSwords = [];
(function placeSwords(){
  const W = 10, MINH = 45, cand = [];
  for(let j = 0; j < N; j++) for(let i = 0; i < N; i++){
    const h = heights[(j*N + i)*4];
    if(h < MINH) continue;
    let top = true;
    for(let dj = -W; dj <= W && top; dj++) for(let di = -W; di <= W; di++){
      if(heights[((((j+dj) & (N-1))*N) + ((i+di) & (N-1)))*4] > h){ top = false; break; }
    }
    if(top) cand.push({x: i*CELL, z: j*CELL, h});
  }
  cand.sort((a, b) => b.h - a.h);
  const wrap = d => d - PERIOD*Math.round(d/PERIOD);
  for(const c of cand){
    if(worldSwords.length >= 16) break;
    if(worldSwords.some(w => Math.hypot(wrap(w.x - c.x), wrap(w.z - c.z)) < 100)) continue;
    const ci = Math.round(c.x/CELL), cj = Math.round(c.z/CELL);   // hash-seeded so every player sees the same swords
    worldSwords.push({x: c.x, z: c.z, type: SWORD_KEYS[Math.floor(hash2(ci, cj + 31)*SWORD_KEYS.length)],
                      yaw: hash2(ci + 7, cj)*6.28, lean: (hash2(ci, cj + 13) - 0.5)*0.35});
  }
})();

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');

const vs = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p; gl_Position = vec4(p,0.,1.); }`;

const SKYFN = `
uniform vec3 SUN;                                   // direction towards the sun (moves over time)
float dayK(){ return smoothstep(-0.12, 0.22, SUN.y); }   // 0 = night, 1 = full day
vec3 sunColor(){ return mix(vec3(1.0,0.55,0.28), vec3(1.0,0.92,0.78), smoothstep(0.0, 0.4, SUN.y)); }
uniform vec4 flashF;                                // xyz = where the player looks, w = flashlight on (1) / off (0)
// flashlight: a wide cone from the eye; p = lit point, n = its surface normal
vec3 torch(vec3 p, vec3 cam, vec3 n){
  if(flashF.w < 0.5) return vec3(0.);
  vec3 v = p - cam; float d = max(length(v), 0.01); vec3 dir = v / d;
  float cone = smoothstep(0.55, 0.88, dot(dir, flashF.xyz));
  float atten = (1.0 / (1.0 + d*d*0.006)) * smoothstep(60.0, 18.0, d);
  float lam = 0.45 + 0.55*max(dot(n, -dir), 0.0);
  return vec3(1.0, 0.92, 0.74) * (1.6 * cone * atten * lam * mix(1.0, 0.35, dayK()));
}
vec3 horizonCol(){
  vec3 c = mix(vec3(0.02,0.03,0.07), vec3(0.72,0.88,0.98), dayK());
  float dusk = 1.0 - smoothstep(0.0, 0.35, abs(SUN.y + 0.02));
  return mix(c, vec3(0.95,0.52,0.30), dusk*0.55);
}
`;

const COMMON = `
uniform sampler2D hm;
const float PERIOD = ${PERIOD.toFixed(1)};
const int NN = ${N};
const float CELL = ${CELL.toFixed(4)};
const float NEAR = 0.1, FAR = 4000.0;
uniform vec3 cracks[8];      // xz position + random seed of each cracked spot
uniform int nCracks;
vec2 wrapD(vec2 q){ return q - PERIOD*floor(q/PERIOD + 0.5); }
${SKYFN}

float H(vec2 p){
  vec2 f = p * (float(NN) / PERIOD);
  vec2 fl = floor(f), fr = f - fl;
  ivec2 i = ivec2(fl) & ivec2(NN-1);
  float a = texelFetch(hm, i, 0).r;
  float b = texelFetch(hm, (i + ivec2(1,0)) & ivec2(NN-1), 0).r;
  float c = texelFetch(hm, (i + ivec2(0,1)) & ivec2(NN-1), 0).r;
  float d = texelFetch(hm, (i + ivec2(1,1)) & ivec2(NN-1), 0).r;
  return mix(mix(a,b,fr.x), mix(c,d,fr.x), fr.y);
}
// bed height and river surface height at this spot (surface is far below when there is no river)
vec2 HW(vec2 p){
  vec2 f = p * (float(NN) / PERIOD);
  vec2 fl = floor(f), fr = f - fl;
  ivec2 i = ivec2(fl) & ivec2(NN-1);
  vec4 a = texelFetch(hm, i, 0);
  vec4 b = texelFetch(hm, (i + ivec2(1,0)) & ivec2(NN-1), 0);
  vec4 c = texelFetch(hm, (i + ivec2(0,1)) & ivec2(NN-1), 0);
  vec4 d = texelFetch(hm, (i + ivec2(1,1)) & ivec2(NN-1), 0);
  vec4 m = mix(mix(a,b,fr.x), mix(c,d,fr.x), fr.y);
  return vec2(m.r, m.b);
}
// height of rock outcrop at this spot (0 = bare ground)
float R(vec2 p){
  vec2 f = p * (float(NN) / PERIOD);
  vec2 fl = floor(f), fr = f - fl;
  ivec2 i = ivec2(fl) & ivec2(NN-1);
  float a = texelFetch(hm, i, 0).g;
  float b = texelFetch(hm, (i + ivec2(1,0)) & ivec2(NN-1), 0).g;
  float c = texelFetch(hm, (i + ivec2(0,1)) & ivec2(NN-1), 0).g;
  float d = texelFetch(hm, (i + ivec2(1,1)) & ivec2(NN-1), 0).g;
  return mix(mix(a,b,fr.x), mix(c,d,fr.x), fr.y);
}
`;

const fs = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 uv; out vec4 o;

${COMMON}
uniform vec3 pos;
uniform sampler2D fl;       // river flow direction
uniform float time, fast;   // fast = 1: cheaper shading (no terrain shadows, flat water)
uniform float yaw, pitch, aspect, tanH, pixAng, maxH;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}

vec2 flowAt(vec2 p){
  vec2 f = p * (float(NN) / PERIOD);
  vec2 fr = f - floor(f);
  ivec2 i = ivec2(floor(f)) & ivec2(NN-1);
  vec2 a = texelFetch(fl, i, 0).rg;
  vec2 b = texelFetch(fl, (i + ivec2(1,0)) & ivec2(NN-1), 0).rg;
  vec2 c = texelFetch(fl, (i + ivec2(0,1)) & ivec2(NN-1), 0).rg;
  vec2 d = texelFetch(fl, (i + ivec2(1,1)) & ivec2(NN-1), 0).rg;
  return mix(mix(a,b,fr.x), mix(c,d,fr.x), fr.y);
}
float ripple(vec2 q){ return vnoise(q*0.9)*0.65 + vnoise(q*2.2 + 7.3)*0.28 + vnoise(q*5.0 + 2.1)*0.07; }

vec3 skyCol(vec3 d){
  float k = dayK();
  vec3 zenith = mix(vec3(0.01,0.015,0.05), vec3(0.16,0.45,0.85), k);
  vec3 sky = mix(horizonCol(), zenith, pow(clamp(d.y,0.,1.), 0.5));
  // stars at night
  vec2 sp = vec2(atan(d.x, d.z), asin(clamp(d.y,-1.,1.)));
  float star = step(0.9972, hash(floor(sp*vec2(260.,170.)))) * (1.0 - k) * smoothstep(0.02, 0.15, d.y);
  sky += vec3(star);
  float sd = max(dot(d, SUN), 0.);
  sky += sunColor() * (pow(sd,6.)*0.12 + pow(sd,48.)*0.35 + pow(sd,400.)*0.6);
  sky = mix(sky, mix(vec3(1.0,0.75,0.5), vec3(1.0,0.98,0.9), smoothstep(0.0,0.4,SUN.y)),
            smoothstep(0.99955, 0.99975, sd));
  return sky;
}

// Voronoi cell borders = fracture lines, fading out towards the edge of the cracked patch
float crackAt(vec2 q, float seed, float w, float r){
  float extent = 1.9*(0.7 + 0.3*vnoise(q*2.5 + seed));
  float mask = 1.0 - smoothstep(extent*0.5, extent, r);
  if(mask <= 0.) return 0.;
  vec2 g = q*1.6 + vec2(seed*3.1, seed*1.7);
  vec2 ip = floor(g), fp = fract(g);
  float d1 = 9., d2 = 9.;
  for(int j = -1; j <= 1; j++) for(int i = -1; i <= 1; i++){
    vec2 b = vec2(float(i), float(j));
    vec2 o = vec2(hash(ip + b + 11.1), hash(ip + b + 57.7));
    float dd = length(b + o - fp);
    if(dd < d1){ d2 = d1; d1 = dd; } else if(dd < d2){ d2 = dd; }
  }
  float wd = (0.06 + w*1.5) * 1.6;
  return (1.0 - smoothstep(wd*0.4, wd, d2 - d1)) * mask;
}

vec3 grass(vec2 g, float w){
  float pat = vnoise(g*0.08)*0.5 + vnoise(g*0.4)*0.3 + vnoise(g*1.7)*0.2;
  float f1 = vnoise(g*vec2(60.,14.))*0.5 + vnoise(vec2(g.x*14., g.y*60.))*0.5;
  float f2 = vnoise(g*vec2(180.,40.))*0.5 + vnoise(vec2(g.x*40., g.y*180.))*0.5;
  float f3 = hash(floor(g*220.));
  float d1 = 1.0 - smoothstep(0.02, 0.12, w);
  float d2 = 1.0 - smoothstep(0.005, 0.04, w);
  float tone = pat*0.75 + (f1-0.5)*0.7*d1 + (f2-0.5)*0.5*d2 + (f3-0.5)*0.35*d2;
  vec3 dark  = vec3(0.10,0.28,0.07);
  vec3 mid   = vec3(0.24,0.50,0.13);
  vec3 light = vec3(0.50,0.72,0.22);
  vec3 c = mix(dark, mid, smoothstep(0.1,0.5,tone));
  c = mix(c, light, smoothstep(0.5,0.95,tone));
  c = mix(c, vec3(0.55,0.55,0.22), smoothstep(0.62,0.9,vnoise(g*0.25))*0.25);
  return c;
}

vec3 rock(vec3 p, float w){
  float fine = 1.0 - smoothstep(0.02, 0.2, w);
  float st = vnoise(vec2((p.x+p.z)*0.22, p.y*1.5))*0.5
           + vnoise(vec2(p.x*0.7 + p.y*0.5, p.z*0.7 - p.y*0.5))*0.3
           + (vnoise(vec2(p.x*3.1 + p.y*2.3, p.z*3.1 - p.y*1.9)) - 0.5)*0.4*fine
           + (hash(floor(vec2(p.x+p.z, p.y)*14.)) - 0.5)*0.25*fine
           + 0.1;
  vec3 darkRock  = vec3(0.20,0.18,0.17);
  vec3 lightRock = vec3(0.60,0.54,0.47);
  return mix(darkRock, lightRock, clamp(st,0.,1.));
}

void main(){
  vec3 up = vec3(0.,1.,0.);
  vec3 f = vec3(sin(yaw),0.,-cos(yaw));
  vec3 r = vec3(cos(yaw),0.,sin(yaw));
  vec3 F = f*cos(pitch) + up*sin(pitch);
  vec3 U = -f*sin(pitch) + up*cos(pitch);
  vec3 d = normalize(F + r*uv.x*tanH*aspect + U*uv.y*tanH);

  vec3 ro = pos;
  float t = 0.3, tp = 0.3;
  bool hit = false;
  for(int i = 0; i < 280; i++){
    vec3 p = ro + d*t;
    vec2 hw0 = HW(p.xz);
    float hh = p.y - max(hw0.x, hw0.y);          // the ground, or the river surface above it
    if(hh < 0.0){ hit = true; break; }
    if(d.y > 0.0 && p.y > maxH) break;
    tp = t;
    t += max(hh*0.45, 0.035*t + 0.1);
    if(t > 2600.0) break;
  }

  vec3 col;
  if(!hit){
    col = skyCol(d);
    gl_FragDepth = 1.0;
  } else {
    float lo = tp, hi = t;
    for(int i = 0; i < 7; i++){
      float mid = 0.5*(lo+hi);
      vec3 q = ro + d*mid;
      vec2 hq = HW(q.xz);
      if(q.y - max(hq.x, hq.y) < 0.0) hi = mid; else lo = mid;
    }
    t = hi;
    vec3 p = ro + d*t;
    vec2 hw = HW(p.xz);
    bool isWater = hw.y > hw.x + 0.02;
    float e = CELL;
    vec3 n = normalize(vec3(H(p.xz - vec2(e,0.)) - H(p.xz + vec2(e,0.)), 2.*e,
                            H(p.xz - vec2(0.,e)) - H(p.xz + vec2(0.,e))));
    float w = t*pixAng / max(abs(dot(n,d)), 0.04);

    float zv = dot(p - ro, F);
    gl_FragDepth = ((FAR+NEAR)/(FAR-NEAR) - 2.*FAR*NEAR/((FAR-NEAR)*zv))*0.5 + 0.5;

    if(isWater){
      // flowing river: ripples drift downstream, sky reflection, sparkle, shore foam
      float depth = hw.y - hw.x;
      vec2 adv = p.xz - flowAt(p.xz) * time * 1.8;
      float fadeW = 1.0 / (1.0 + t*0.03);
      float e2 = 0.12;
      vec3 wn = vec3(0., 1., 0.);
      if(fast < 0.5){
        float w0 = ripple(adv), wx = ripple(adv + vec2(e2, 0.)), wz = ripple(adv + vec2(0., e2));
        wn = normalize(vec3(-(wx - w0)/e2*0.5*fadeW, 1.0, -(wz - w0)/e2*0.5*fadeW));
      }
      float dkw = dayK();
      float fres = 0.04 + 0.96*pow(1.0 - max(dot(-d, wn), 0.0), 4.0);
      vec3 rd = reflect(d, wn); rd.y = abs(rd.y);
      vec3 body = mix(vec3(0.10,0.40,0.44), vec3(0.01,0.08,0.18), smoothstep(0.1, 2.3, depth));
      vec3 bed = vec3(0.30,0.27,0.19) * vec3(0.7,0.9,0.9);
      body = mix(body, bed, exp(-depth*1.6)*0.6) * mix(0.12, 1.0, dkw);   // clear in the shallows
      float spec = pow(max(dot(reflect(-SUN, wn), -d), 0.0), 180.0) * dkw * 2.5;
      float foam = smoothstep(0.45, 0.0, depth) * (0.5 + 0.5*vnoise(adv*3.0));
      col = mix(body, skyCol(rd), clamp(fres, 0., 1.)) + sunColor()*spec;
      col = mix(col, vec3(0.92,0.96,0.98)*mix(0.25, 1.0, dkw), foam*0.85);
      col += torch(p, pos, wn) * vec3(0.25, 0.4, 0.45);
    } else {
    float steep = 1.0 - n.y;
    float rk = max(max(smoothstep(0.10, 0.26, steep), smoothstep(45., 85., p.y)), smoothstep(0.03, 0.35, R(p.xz)));
    vec3 alb = mix(grass(p.xz, w), rock(p, w), rk);
    float crk = 0.0;
    for(int i = 0; i < 8; i++){
      if(i >= nCracks) break;
      vec2 q = wrapD(p.xz - cracks[i].xy);
      float rr = length(q);
      if(rr < 2.2) crk = max(crk, crackAt(q, cracks[i].z, w, rr));
    }
    alb *= 1.0 - 0.93*crk;

    float dk = dayK();
    float sunL = max(dot(n, SUN), 0.) * dk;
    if(sunL > 0.001 && fast < 0.5){         // terrain shadows: hills, valley walls and crater rims block the sun
      float shd = 1.0, st = 0.8;
      vec3 q0 = p + n*0.3;
      for(int i = 0; i < 40; i++){
        vec3 q = q0 + SUN*st;
        float hh = q.y - H(q.xz);
        shd = min(shd, clamp(6.0*hh/st, 0., 1.));
        if(shd < 0.01 || q.y > maxH) break;
        st += max(hh*0.5, 0.4 + 0.05*st);
        if(st > 220.) break;
      }
      sunL *= shd;
    }
    vec3 amb = vec3(0.50,0.62,0.85) * (0.30 + 0.25*n.y) * mix(0.16, 1.0, dk);
    col = alb * (amb + sunColor()*sunL*0.95 + torch(p, pos, n));
    }

    float fog = 1.0 - exp(-t*0.0014);
    vec3 haze = horizonCol() + sunColor()*pow(max(dot(d,SUN),0.),8.)*0.15*dayK();
    col = mix(col, haze, clamp(fog,0.,1.));
  }
  o = vec4(col,1.);
}`;


// ---- 3D grass blades: instanced, placed on a world-fixed grid around the player ----
const BLADE_CELL = 0.2, BLADE_G = 260;
const bvs = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
${COMMON}
uniform vec3 camPos, cR, cU, cF;
uniform float tanH, aspect, time;
out vec3 vCol;

const int G = ${BLADE_G};
const float CS = ${BLADE_CELL.toFixed(3)};
const float TY[4] = float[4](0.0, 0.35, 0.70, 1.0);
const float TW[4] = float[4](1.0, 0.85, 0.50, 0.0);
const float ST[10] = float[10](1.0, 2.5, 5.0, 9.0, 15.0, 25.0, 40.0, 60.0, 90.0, 130.0);

float hh(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }

void main(){
  int id = gl_InstanceID;
  vec2 cell = floor(camPos.xz / CS) - float(G/2) + vec2(float(id % G), float(id / G));
  vec2 cw = mod(cell, 4096.0);
  float h1 = hh(cw), h2 = hh(cw + 17.3), h3 = hh(cw + 41.7), h4 = hh(cw + 73.1), h5 = hh(cw + 101.9);

  vec2 xz = (cell + vec2(h1, h2)) * CS;
  float dist = length(xz - camPos.xz);
  float lod = 1.0 - smoothstep(18.0, 25.0, dist);
  float y0 = H(xz);

  // only on gentle, low ground (matches where the terrain shader paints grass)
  float e = 0.75;
  vec3 n = normalize(vec3(H(xz - vec2(e,0.)) - H(xz + vec2(e,0.)), 2.*e,
                          H(xz - vec2(0.,e)) - H(xz + vec2(0.,e))));

  lod *= 1.0 - smoothstep(0.3, 0.9, rk);
  vec2 hwB = HW(xz);
  lod *= smoothstep(0.1, 0.5, hwB.x - hwB.y);     // no grass in or beside the river
  lod *= smoothstep(0.04, 0.16, h3);          // a few bare patches
  for(int c = 0; c < 8; c++){
    if(c >= nCracks) break;
    lod *= smoothstep(0.5, 1.3, length(wrapD(xz - cracks[c].xy)));
  }

  if(lod < 0.01){ gl_Position = vec4(2.,2.,2.,1.); vCol = vec3(0.); return; }

  int vid = gl_VertexID;
  int lv = min(vid/2, 3);
  float side = (vid % 2 == 0) ? -1.0 : 1.0;
  float t = TY[lv], w = TW[lv];

  float ang = h4 * 6.2832;
  vec2 sv = vec2(cos(ang), sin(ang));
  vec2 fw = vec2(-sin(ang), cos(ang));
  float height = (0.28 + 0.55*h5*h5 + 0.12*h2) * lod;
  float width  = 0.034 * (0.8 + 0.6*h3) * lod;
  float bend   = (0.12 + 0.5*h2) * height;
  float sway   = sin(time*1.7 + xz.x*0.35 + xz.y*0.27) * 0.07 * height;

  vec3 pos = vec3(xz.x, y0 - 0.05, xz.y);
  pos.xz += sv * side * w * width + fw * (bend + sway) * t * t;
  pos.y  += height * t - 0.25 * bend * t * t;

  vec3 baseC = mix(vec3(0.06,0.18,0.04), vec3(0.18,0.42,0.08), h1);
  vec3 tipC  = mix(vec3(0.34,0.58,0.13), vec3(0.62,0.74,0.24), h2);
  vec3 col = mix(baseC, tipC, pow(t, 0.8));
  col = mix(col, vec3(0.58,0.54,0.20), step(0.92, fract(h1*7.3)) * t);   // dry blades

  vec3 nn = normalize(vec3(fw.x*0.5, 1.0, fw.y*0.5));
  float dk = dayK();
  float shd = 1.0;
  if(dk > 0.001){
    vec3 q0 = vec3(xz.x, y0 + 0.3, xz.y);
    for(int i = 0; i < 10; i++){
      float st = ST[i];
      vec3 q = q0 + SUN*st;
      shd = min(shd, clamp(6.0*(q.y - H(q.xz))/st, 0., 1.));
    }
  }
  float sunL = (max(dot(nn, SUN), 0.0)*0.7 + 0.25) * dk * shd;
  vec3 amb = vec3(0.50,0.62,0.85) * (0.30 + 0.25*n.y) * (0.35 + 0.65*t) * mix(0.16, 1.0, dk);   // darker at the roots
  vec3 lit = col * (amb + sunColor() * sunL * (0.4 + 0.6*t) * 0.95 + torch(pos, camPos, vec3(0.,1.,0.)));
  float fog = 1.0 - exp(-dist*0.0014);
  vCol = mix(lit, horizonCol(), clamp(fog, 0., 1.));

  vec3 rel = pos - camPos;
  float zv = dot(rel, cF), xv = dot(rel, cR), yv = dot(rel, cU);
  gl_Position = vec4(xv/(tanH*aspect), yv/tanH,
                     (FAR+NEAR)/(FAR-NEAR)*zv - 2.*FAR*NEAR/(FAR-NEAR), zv);
}`;

const FIST_REACH = 2.6, SWORD_REACH = 2.6, PUNCH_TIME = 0.8;

// wind-up, then a hard thrust that lands at t = 0.5, then recover
function punchE(t){
  const k = [[0,0],[0.3,-0.35],[0.5,1],[1,0]];
  for(let i = 1; i < k.length; i++) if(t <= k[i][0]){
    const u = (t - k[i-1][0])/(k[i][0] - k[i-1][0]), m = u*u*(3 - 2*u);
    return k[i-1][1] + (k[i][1] - k[i-1][1])*m;

}
const wrapD = (a, b) => (a - b) - PERIOD*Math.round((a - b)/PERIOD);

// second hit: the cracked ground gives way in an irregular crater; rocks shatter
function breakArea(cx, cz, ph, replay){
  const r3 = v => Math.round(v*1000)/1000;
  cx = r3(((cx % PERIOD) + PERIOD) % PERIOD);
  cz = r3(((cz % PERIOD) + PERIOD) % PERIOD);
  ph = ph || [r3(Math.random()*6.28), r3(Math.random()*6.28), r3(Math.random()*6.28)];
  if(!replay) digLog.push([cx, cz, ph[0], ph[1], ph[2]]);
  const ph1 = ph[0], ph2 = ph[1], ph3 = ph[2];
  const reach = BREAK_R*1.45;
  const i0 = Math.floor((cx - reach)/CELL), i1 = Math.ceil((cx + reach)/CELL);
  const j0 = Math.floor((cz - reach)/CELL), j1 = Math.ceil((cz + reach)/CELL);
  for(let j = j0; j <= j1; j++) for(let i = i0; i <= i1; i++){
    const dx = i*CELL - cx, dz = j*CELL - cz;
    const d = Math.hypot(dx, dz);
    const a = Math.atan2(dz, dx);
    const rmod = 1 + 0.22*Math.sin(3*a + ph1) + 0.14*Math.sin(5*a + ph2) + 0.08*Math.sin(9*a + ph3);
    const dn = d / (BREAK_R*rmod);
    if(dn >= 1) continue;
    const c = Math.cos(Math.PI*0.5*dn);
    const amt = BREAK_DEPTH * Math.pow(c, 1.3) * (0.85 + 0.3*hash2(i & 1023, j & 1023));
    const k = (((j & (N-1))*N) + (i & (N-1))) * 4;
    heights[k+1] = Math.max(0, heights[k+1] - amt*1.5);   // rocks shatter faster than soil
    heights[k]   = Math.max(MIN_H, heights[k] - amt);

}

function doPunch(){
  const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
  const sp = Math.sin(player.pitch), cp = Math.cos(player.pitch);
  const dx = s*cp, dy = sp, dz = -c*cp;
  const ox = player.x, oy = player.y + EYE, oz = player.z;
  const reach = weapon ? SWORD_REACH : FIST_REACH;
  for(let t = 0.2; t <= reach; t += 0.08){
    const x = ox + dx*t, y = oy + dy*t, z = oz + dz*t;
    for(const m of monsters){
      if(Math.hypot(x - m.x, z - m.z) < 0.8*MS && y > m.y - 0.1 && y < m.y + 2.5*MS){
        hitMonster(m); return;
      }
    }
    for(const r of remote.values()){                                  // other players
      if(r.dd || !r.id) continue;
      if(Math.hypot(x - r.x, z - r.z) < 0.85*MSP && y > r.y - 0.1 && y < r.y + 2.6*MSP){
        hitPlayer(r); return;
      }
    }
    if(y < heightAt(x, z)){
      const idx = cracks.findIndex(k => Math.hypot(wrapD(x, k.x), wrapD(z, k.z)) < CRACK_LINK);
      if(idx >= 0){                       // already cracked -> break it open
        const k = cracks.splice(idx, 1)[0];
        breakArea(k.x, k.z);
      } else {                            // first hit -> crack the surface
        cracks.push({x, z, seed: Math.random()*50});
        if(cracks.length > MAX_CRACKS) cracks.shift();
      }
      return;
    }
  }
}

const SAVE_KEY = 'ug-saves';

function storeSaves(a){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(a)); return true; } catch(e){ return false; } }
function snapshot(){
  const r = (v, k = 100) => Math.round(v*k)/k;
  return {
    x: r(player.x), y: r(player.y), z: r(player.z), yaw: r(player.yaw, 1000), pitch: r(player.pitch, 1000),
    hp: Math.round(hp.v), weapon: weapon || '', gameT: r(gameT, 10),
    digs: digLog, cracks: cracks.map(k => [r(k.x), r(k.z), r(k.seed)]),
    swords: worldSwords.map(w => [r(w.x), r(w.z), w.type, r(w.yaw), r(w.lean)]),
  };
}
function saveNow(){
  if(!curSave || mpRoom || !started) return;
  if(!dead) curSave.state = snapshot();                         // while dead, keep the last living state
  curSave.played = Date.now();
  const all = loadSaves(), i = all.findIndex(g => g.id === curSave.id);
  if(i >= 0) all[i] = curSave; else all.push(curSave);
  storeSaves(all);
}
function applySave(st){
  for(const d of st.digs || []){ digLog.push(d); breakArea(d[0], d[1], [d[2], d[3], d[4]], true); }
  if((st.digs || []).length) uploadHeights();
  cracks.length = 0; for(const k of st.cracks || []) cracks.push({x: k[0], z: k[1], seed: k[2]});
  if(Array.isArray(st.swords)){
    worldSwords.length = 0;
    for(const w of st.swords) if(SWORD_TYPES[w[2]]) worldSwords.push({x: w[0], z: w[1], type: w[2], yaw: w[3], lean: w[4]});
  }
  weapon = SWORD_TYPES[st.weapon] ? st.weapon : null;
  if(weapon) wpnEl.textContent = SWORD_TYPES[weapon].name + ' (' + SWORD_TYPES[weapon].dmg + ' dmg)';
  hp.v = Math.max(1, Math.min(MAX_HP, st.hp || MAX_HP)); hp.last = -1e9;
  gameT = st.gameT || 0;
  if(typeof st.x === 'number'){
    player.x = st.x; player.z = st.z; player.yaw = st.yaw || 0; player.pitch = st.pitch || 0;
    player.y = Math.max(st.y || 0, groundAt(player.x, player.z)); player.vy = 0; player.grounded = true; player.airPeak = player.y;
  }
}

function updateMonsters(dt){
  gameT += dt;
  nextSpawn -= dt;
  if(nextSpawn <= 0){
    if(monsters.length >= MAX_MONSTERS){
      nextSpawn = 20 + Math.random()*30;
    } else {
      // monsters only appear where it is dark: anywhere at night, or in shade during the day
      const sun = sunDir();
      let spot = null;
      for(let tries = 0; tries < 24 && !spot; tries++){
        const ang = Math.random()*6.2832, d = 35 + Math.random()*35;
        const x = player.x + Math.cos(ang)*d, z = player.z + Math.sin(ang)*d;
        if(lightAt(x, z, sun) < DARK_LEVEL) spot = [x, z];
      }
      if(spot){
        monsters.push({x: spot[0], z: spot[1], y: 0,
                       yaw: 0, phase: Math.random()*6, atk: -1, cool: 1, hit: false, moving: false,
                       hp: MONSTER_HP, bar: null, showUntil: 0, hitT: -1e9});
        nextSpawn = 20 + Math.random()*30;
      } else nextSpawn = 4;                // nowhere dark nearby: look again shortly
    }
  }
  for(let i = monsters.length - 1; i >= 0; i--){
    const m = monsters[i];
    const dx = player.x - m.x, dz = player.z - m.z, d = Math.hypot(dx, dz);
    if(d > 160){ removeMonster(i); continue; }
    m.yaw = Math.atan2(dx, dz);
    if(m.atk >= 0){
      m.atk += dt / 0.7; m.moving = false;
      if(!m.hit && m.atk >= 0.45){
        m.hit = true;
        if(d < 2.4 && Math.abs(player.y - m.y) < 2.6) hurt(HIT_DAMAGE);
      }
      if(m.atk >= 1){ m.atk = -1; m.cool = 0.9; }
    } else {
      m.cool -= dt;
      if(d > 1.7){
        const st = M_SPEED * dt;
        m.x += dx/d*st; m.z += dz/d*st;
        m.moving = true; m.phase += dt * M_SPEED * 2.6;
      } else {
        m.moving = false;
        if(m.cool <= 0){ m.atk = 0; m.hit = false; }
      }
    }
    m.y = groundAt(m.x, m.z);
  }
  // slow passive healing once 30 s have passed without taking damage
  if(gameT - hp.last > REGEN_DELAY && hp.v < MAX_HP) hp.v = Math.min(MAX_HP, hp.v + REGEN_RATE*dt);
  if(hp.v <= 0 && !dead) die();
  showHp();
}

// monster health bars: HTML bars projected onto the screen, shown for a few seconds after a hit
function updateBars(cx, cy, cz, cR_, cU_, cF_, aspect){
  for(const m of monsters){
    let show = gameT < m.showUntil;
    let sx = 0, sy = 0;
    if(show){
      const hx = m.x, hy = m.y + 2.75*MS, hz = m.z;
      const rx = hx - cx, ry = hy - cy, rz = hz - cz;
      const zv = rx*cF_[0] + ry*cF_[1] + rz*cF_[2];
      if(zv < 0.3 || zv > 80) show = false;
      else {
        const xv = rx*cR_[0] + ry*cR_[1] + rz*cR_[2];
        const yv = rx*cU_[0] + ry*cU_[1] + rz*cU_[2];
        sx = (xv/(zv*TANH*aspect)*0.5 + 0.5) * innerWidth;
        sy = (1 - (yv/(zv*TANH)*0.5 + 0.5)) * innerHeight;
        const len = Math.hypot(rx, ry, rz);
        for(let t = 1.0; t < len; t += 0.6){            // hidden if terrain is in the way
          const f = t/len;
          if(cy + ry*f < heightAt(cx + rx*f, cz + rz*f)){ show = false; break; }
        }
      }
    }
    if(show && !m.bar){
      m.bar = document.createElement('div'); m.bar.className = 'mbar';
      m.bar.innerHTML = '<i></i>'; document.body.appendChild(m.bar);
    }
    if(m.bar){
      m.bar.style.display = show ? 'block' : 'none';
      if(show){
        m.bar.style.left = sx + 'px'; m.bar.style.top = sy + 'px';
        m.bar.firstChild.style.width = Math.max(0, m.hp/MONSTER_HP*100) + '%';
      }
    }
  }
}

function drawSwords(sunNow){
  gl.uniform1f(mTint, 0); gl.uniform1f(mRx, 0); gl.uniform1f(mEmis, 0);
  for(const w of worldSwords){
    if(Math.hypot(wrapD(w.x, player.x), wrapD(w.z, player.z)) > 400) continue;
    const t = SWORD_TYPES[w.type];
    gl.uniform3f(mBase, w.x, heightAt(w.x, w.z), w.z);
    gl.uniform1f(mYaw, w.yaw);
    gl.uniform1f(mVis, shadowAt(w.x, w.z, sunNow));
    const part = (ox,oy,oz, sx,sy,sz, c) => {
      gl.uniform3f(mOff, ox,oy,oz); gl.uniform3f(mSize, sx,sy,sz); gl.uniform3f(mCol, c[0],c[1],c[2]);
      gl.uniform3f(mPivot, 0,0,0); gl.uniform1f(mRx, w.lean);
      gl.drawArrays(gl.TRIANGLES, 0, 36);
    };
    part(0,  0.30, 0, 0.13, 1.30, 0.035, t.blade);          // blade, buried point-down
    part(0,  0.98, 0, 0.58, 0.075, 0.10, t.guard);          // crossguard
    part(0,  1.20, 0, 0.07, 0.40, 0.07, [0.22,0.13,0.08]);  // grip
    part(0,  1.45, 0, 0.12, 0.10, 0.12, t.guard);           // pommel
  }
}

function drawMonsters(){

// ---- sun: rises in the east, crosses the sky in front of the start, sets, and a night follows ----
const DAY_LEN = 240;                 // seconds for a full day/night cycle
function sunDir(){
  const a = 0.5 + (mpRoom ? Date.now()/1000 : gameT) * 2*Math.PI / DAY_LEN;   // multiplayer: wall clock, so everyone sees the same sun
  const x = Math.cos(a), y = Math.sin(a)*0.9 + 0.18, z = -0.9;
  const l = Math.hypot(x, y, z);
  return [x/l, y/l, z/l];
}

// How lit is a spot? 0 = dark (night, in shadow, or facing away from the sun), 1 = full sun.
function shadowAt(x, z, sun){
  if(sun[1] < -0.2) return 0;
  const y0 = heightAt(x, z) + 0.3;
  let shd = 1;
  for(const t of [1, 2.5, 5, 9, 15, 25, 40, 60, 90, 130, 180]){
    const hh = y0 + sun[1]*t - heightAt(x + sun[0]*t, z + sun[2]*t);
    shd = Math.min(shd, Math.max(0, Math.min(1, 6*hh/t)));
  }
  return shd;
}
function lightAt(x, z, sun){
  const k = sstep(-0.12, 0.22, sun[1]);
  if(k < 0.001) return 0;
  const e = CELL;
  const nx = heightAt(x - e, z) - heightAt(x + e, z), nz = heightAt(x, z - e) - heightAt(x, z + e), ny = 2*e;
  const nl = Math.hypot(nx, ny, nz);
  const ndl = (nx*sun[0] + ny*sun[1] + nz*sun[2]) / nl;
  if(ndl <= 0) return 0;
  return k * shadowAt(x, z, sun) * Math.min(1, ndl*2);
}

// ---- picking swords up: hold E next to one ----
const PICK_R = 3.0, PICK_TIME = 0.8;
const promptEl = document.getElementById('prompt'), ptxt = document.getElementById('ptxt'),
      pfill = document.getElementById('pfill'), wpnEl = document.getElementById('wpn');
let pickTarget = null, pickProg = 0;
function updatePickup(dt){
  let best = null, bd = PICK_R;
  if(!dead) for(const w of worldSwords){
    const d = Math.hypot(wrapD(w.x, player.x), wrapD(w.z, player.z));
    if(d < bd && Math.abs(heightAt(w.x, w.z) - player.y) < 3.5){ bd = d; best = w; }
  }
  if(best !== pickTarget){ pickTarget = best; pickProg = 0; }
  if(pickTarget && down('pickup')){
    pickProg += dt / PICK_TIME;
    if(pickProg >= 1){
      const w = pickTarget;
      if(weapon) worldSwords.push({x: player.x, z: player.z, type: weapon, yaw: Math.random()*6.28, lean: 0.1});   // swap: drop the old one
      weapon = w.type;
      worldSwords.splice(worldSwords.indexOf(w), 1);
      pickTarget = null; pickProg = 0;
      const t = SWORD_TYPES[weapon];
      wpnEl.textContent = t.name + ' (' + t.dmg + ' dmg)';
    }
  } else pickProg = Math.max(0, pickProg - dt*2);
  if(pickTarget){
    const t = SWORD_TYPES[pickTarget.type];
    promptEl.style.display = 'block';
    ptxt.textContent = 'Hold E to pick up ' + t.name + ' (' + t.dmg + ' dmg)';
    pfill.style.width = Math.min(100, pickProg*100) + '%';
  } else promptEl.style.display = 'none';
}

// ---- multiplayer: players see each other through the artifact's `room` capability ----
// Everyone is in the same deterministic world; only positions, punches and weapons are shared.
// Digging, monsters and sword pickups stay local to each player.
let mpRoom = null, mpCode = '';
const remote = new Map();            // peer id -> smoothed avatar state
let lastSend = 0, lastMP = performance.now(), mpStart = 0;
const mpInfo = document.getElementById('mpinfo');

// ---- WebRTC transport: Firebase Realtime Database for signalling, STUN/TURN for connecting ----
const FIREBASE_READY = !FIREBASE_CONFIG.apiKey.startsWith('YOUR_');
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const ICE_LIST = ICE_SERVERS.filter(sv => !JSON.stringify(sv.urls).includes('YOUR_'));

// Returns an object with the same shape as the artifact room: presence(patch) and peers().
async function connectWebRTC(code){
  const [A, AU, D] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'),
                                        import(FB + 'firebase-database.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = AU.getAuth(app);
  await AU.setPersistence(auth, AU.inMemoryPersistence);     // a fresh anonymous id every visit
  const uid = (await AU.signInAnonymously(auth)).user.uid;
  const db = D.getDatabase(app);
  const base = 'rooms/' + code;
  const links = new Map();                                   // other player's id -> connection
  const state = {};                                          // my presence, resent to everyone
  let chain = Promise.resolve();
  const enqueue = fn => { chain = chain.then(fn).catch(() => {}); };

  const sendSignal = (to, type, data) =>
    D.set(D.push(D.ref(db, `${base}/signals/${to}/${uid}`)), {type, data, t: Date.now()}).catch(() => {});
  const closeLink = id => {
    const l = links.get(id); if(!l) return;
    try { l.dc && l.dc.close(); } catch(e){}
    try { l.pc.close(); } catch(e){}
    links.delete(id);
  };
  const pushState = l => { if(l.dc && l.dc.readyState === 'open') l.dc.send(JSON.stringify(state)); };

  function newLink(id, initiator){
    const pc = new RTCPeerConnection({iceServers: ICE_LIST, iceTransportPolicy: FORCE_TURN_RELAY ? 'relay' : 'all'});
    const l = {pc, dc: null, open: false, presence: null, queue: []};
    links.set(id, l);
    pc.onicecandidate = e => { if(e.candidate) sendSignal(id, 'ice', JSON.stringify(e.candidate)); };
    pc.onconnectionstatechange = () => { if(pc.connectionState === 'failed' || pc.connectionState === 'closed') closeLink(id); };
    const wire = dc => {
      l.dc = dc;
      dc.onopen = () => { l.open = true; pushState(l); };
      dc.onclose = () => { l.open = false; };
      dc.onmessage = e => {
        if(typeof e.data !== 'string' || e.data.length > 2000) return;
        try { l.presence = JSON.parse(e.data); } catch(err){}
      };
    };
    if(initiator) wire(pc.createDataChannel('game', {ordered: false, maxRetransmits: 0}));
    else pc.ondatachannel = e => wire(e.channel);
    setTimeout(() => { if(links.get(id) === l && !l.open) closeLink(id); }, 25000);   // give up; retried on next heartbeat
    return l;
  }
  async function startOffer(id){
    const l = newLink(id, true);
    await l.pc.setLocalDescription(await l.pc.createOffer());
    sendSignal(id, 'offer', JSON.stringify(l.pc.localDescription));
  }
  async function flush(l){ for(const c of l.queue.splice(0)) await l.pc.addIceCandidate(c).catch(() => {}); }
  async function handleSignal(from, m){
    if(m.type === 'offer'){
      closeLink(from);
      const l = newLink(from, false);
      await l.pc.setRemoteDescription(JSON.parse(m.data));
      await flush(l);
      await l.pc.setLocalDescription(await l.pc.createAnswer());
      sendSignal(from, 'answer', JSON.stringify(l.pc.localDescription));
    } else if(m.type === 'answer'){
      const l = links.get(from);
      if(l && !l.pc.remoteDescription){ await l.pc.setRemoteDescription(JSON.parse(m.data)); await flush(l); }
    } else if(m.type === 'ice'){
      const l = links.get(from); if(!l) return;
      const c = JSON.parse(m.data);
      if(l.pc.remoteDescription) await l.pc.addIceCandidate(c).catch(() => {}); else l.queue.push(c);
    }
  }

  // announce myself, then connect to everyone who is here (the lower id makes the offer)
  const me = D.ref(db, `${base}/players/${uid}`);
  await D.set(me, {name: myName, t: Date.now()});
  D.onDisconnect(me).remove();
  setInterval(() => D.set(me, {name: myName, t: Date.now()}).catch(() => {}), 20000);   // heartbeat
  const consider = snap => {
    const id = snap.key, v = snap.val();
    if(id === uid || !v || Date.now() - v.t > 90000 || links.has(id)) return;
    if(uid < id) enqueue(() => startOffer(id));
  };
  D.onChildAdded(D.ref(db, `${base}/players`), consider);
  D.onChildChanged(D.ref(db, `${base}/players`), consider);
  D.onChildRemoved(D.ref(db, `${base}/players`), snap => closeLink(snap.key));
  D.onChildAdded(D.ref(db, `${base}/signals/${uid}`), fromSnap => {
    const from = fromSnap.key;
    D.onChildAdded(fromSnap.ref, msg => {
      const v = msg.val(); D.remove(msg.ref).catch(() => {});
      if(v) enqueue(() => handleSignal(from, v));
    });
  });

  return {
    presence(patch){
      Object.assign(state, patch);
      for(const l of links.values()) if(l.open) pushState(l);
      return Promise.resolve();
    },
    peers(){
      const out = [];
      for(const [id, l] of links) if(l.open && l.presence) out.push({peer: id, sameTab: false, presence: l.presence});
      return out;
    },
  };
}

(async function setupMP(){
  const btn = document.getElementById('mp'), msg = document.getElementById('mpmsg');
  const off = t => { btn.textContent = 'Multiplayer unavailable'; msg.textContent = t; };
  const wire = join => {
    btn.disabled = false; btn.textContent = 'Multiplayer';
    btn.addEventListener('click', async () => {
      applyName();
      const code = 'main';
      btn.disabled = true; btn.textContent = 'Joining…'; msg.textContent = '';

    });
  };
  if(FIREBASE_READY){
    if(!ICE_LIST.some(sv => JSON.stringify(sv.urls).includes('turn'))) console.warn('No TURN server configured: some players may not be able to connect.');
    return wire(connectWebRTC);
  }
  try {
    if(!(window.claude && window.claude.use)) return off('Multiplayer works when the game is opened from its published page.');
    const lobby = await window.claude.use('room');
    if(!lobby) return off('Multiplayer needs you to be signed in and invited to this page.');
    wire(code => lobby.join('game-' + code));
  } catch(e){ off('Multiplayer is unavailable right now.'); }
})();

function hueRGB(str){
  let h = 0; for(let i = 0; i < str.length; i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  const a = (h % 360)/60, f = a - Math.floor(a), v = 0.75, sat = 0.6;
  const p = v*(1 - sat), q = v*(1 - sat*f), t = v*(1 - sat*(1 - f));
  return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][Math.floor(a) % 6];
}

function updateMP(){
  if(!mpRoom) return;
  const nowMs = performance.now();
  const rdt = Math.min((nowMs - lastMP)/1000, 0.1); lastMP = nowMs;
  if(chatCur && nowMs > chatClear) chatCur = '';
  if(nowMs - lastSend > 66){                       // ~15 updates a second
    lastSend = nowMs;
    const r2 = v => Math.round(v*100)/100;
    mpRoom.presence({x: r2(player.x), y: r2(player.y), z: r2(player.z), yaw: r2(player.yaw),
                     pt: punch.t >= 1 ? 1 : r2(punch.t), w: weapon || '', n: myName, dd: dead ? 1 : 0, c: chatCur, ci: chatId, id: myCid, h: hitTarget, hi: hitSeq, hd: hitDmg}).catch(() => {});
  }
  const seen = new Set(), f = 1 - Math.exp(-rdt*12);
  for(const p of mpRoom.peers()){
    if(p.sameTab) continue;
    const s = p.presence;
    if(!s || typeof s.x !== 'number' || typeof s.z !== 'number') continue;
    seen.add(p.peer);
    let r = remote.get(p.peer);
    if(!r){ r = {x: s.x, y: s.y, z: s.z, yaw: s.yaw || 0, phase: 0, moving: false, col: hueRGB(p.peer), tag: null, ci: s.ci, announced: false, hi: s.hi, id: '', hitT: -1e9}; remote.set(p.peer, r); }
    const dx = s.x - r.x, dz = s.z - r.z;
    r.moving = Math.hypot(dx, dz) > 0.04;
    if(r.moving) r.phase += rdt*9;
    r.x += dx*f; r.z += dz*f; r.y += ((typeof s.y === 'number' ? s.y : r.y) - r.y)*f;
    const dyaw = (((s.yaw || 0) - r.yaw + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI;
    r.yaw += dyaw*f;
    r.pt = typeof s.pt === 'number' ? s.pt : 1;
    r.w = typeof s.w === 'string' ? s.w : '';
    r.n = typeof s.n === 'string' ? s.n.slice(0, 20) : 'Player';
    r.dd = !!s.dd;
    r.id = typeof s.id === 'string' ? s.id : '';
    if(s.hi !== r.hi){                                           // they landed a hit on someone
      r.hi = s.hi;
      if(s.h === myCid && typeof s.hd === 'number' && !dead && started){
        hurt(Math.max(0, Math.min(60, Math.round(s.hd))));
        const kx = player.x - r.x, kz = player.z - r.z, kd = Math.hypot(kx, kz) || 1;   // small shove away from them
        if(canMove(player.x + kx/kd*0.6, player.z + kz/kd*0.6)){ player.x += kx/kd*0.6; player.z += kz/kd*0.6; }
      }
    }
    if(!r.announced){ r.announced = true; if(nowMs - mpStart > 4000) addChat('', r.n + ' joined the game', true); }   // not for players already there when we arrive
    if(s.ci !== r.ci){ r.ci = s.ci; if(typeof s.c === 'string' && s.c) addChat(r.n, s.c.slice(0, 120)); }
  }
  for(const [k, r] of remote) if(!seen.has(k)){ if(r.tag) r.tag.remove(); remote.delete(k); }
  mpInfo.textContent = 'Multiplayer · ' + (remote.size + 1) + ' player' + (remote.size ? 's' : '');
}

const MSP = 0.78;   // avatar scale
function drawPlayers(sunNow){
  gl.uniform1f(mTint, 0); gl.uniform1f(mEmis, 0);
  for(const r of remote.values()){
    if(r.dd) continue;
    gl.uniform3f(mBase, r.x, r.y, r.z);
    gl.uniform1f(mYaw, Math.PI - r.yaw);
    gl.uniform1f(mTint, Math.max(0, 1 - (performance.now() - r.hitT)/300) * 0.85);     // flashes red when you hit them
    gl.uniform1f(mVis, shadowAt(r.x, r.z, sunNow));
    const sw = r.moving ? Math.sin(r.phase)*0.7 : 0;
    const armed = r.w && SWORD_TYPES[r.w];
    const atk = r.pt < 1 ? keyf(ATTACK_KEYS, r.pt) : (armed ? -0.55 : sw*0.8);
    const c = r.col, skin = [0.88,0.67,0.52], pants = [0.18,0.20,0.30];
    const part = (ox,oy,oz, sx,sy,sz, col, px,py,pz, rx) => {
      gl.uniform3f(mOff, ox*MSP,oy*MSP,oz*MSP); gl.uniform3f(mSize, sx*MSP,sy*MSP,sz*MSP);
      gl.uniform3f(mCol, col[0],col[1],col[2]); gl.uniform3f(mPivot, px*MSP,py*MSP,pz*MSP); gl.uniform1f(mRx, rx);
      gl.drawArrays(gl.TRIANGLES, 0, 36);
    };
    part(-0.2,0.45,0, 0.3,0.9,0.32, pants, -0.2,0.9,0,  sw);
    part( 0.2,0.45,0, 0.3,0.9,0.32, pants,  0.2,0.9,0, -sw);
    part(0,1.4,0, 0.95,1.05,0.55, c, 0,0,0, 0);
    part(0,2.17,0.04, 0.52,0.5,0.5, skin, 0,0,0, 0);
    part(-0.64,1.47,0, 0.26,0.95,0.28, c, -0.64,1.95,0, -sw*0.8);
    part( 0.64,1.47,0, 0.26,0.95,0.28, c,  0.64,1.95,0, atk);
    if(armed){
      const t = SWORD_TYPES[r.w];
      part(0.64, 0.45, 0, 0.06, 1.05, 0.03, t.blade, 0.64,1.95,0, atk);   // blade, in the right hand
      part(0.64, 1.00, 0, 0.34, 0.07, 0.07, t.guard, 0.64,1.95,0, atk);   // crossguard
    }
  }
}

// name tags over other players (HTML, hidden behind terrain)
function updateTags(cx, cy, cz, cR_, cU_, cF_, aspect){
  for(const r of remote.values()){
    let show = !r.dd, sx = 0, sy = 0;
    if(show){
      const rx = r.x - cx, ry = r.y + 2.7*MSP - cy, rz = r.z - cz;
      const zv = rx*cF_[0] + ry*cF_[1] + rz*cF_[2];
      if(zv < 0.3 || Math.hypot(rx, ry, rz) > 30) show = false;       // names appear when players are close
      else {
        const xv = rx*cR_[0] + ry*cR_[1] + rz*cR_[2], yv = rx*cU_[0] + ry*cU_[1] + rz*cU_[2];
        sx = (xv/(zv*TANH*aspect)*0.5 + 0.5) * innerWidth;
        sy = (1 - (yv/(zv*TANH)*0.5 + 0.5)) * innerHeight;
        const len = Math.hypot(rx, ry, rz);
        for(let t = 1.0; t < len; t += 0.8){
          const k = t/len;
          if(cy + ry*k < heightAt(cx + rx*k, cz + rz*k)){ show = false; break; }
        }
      }
    }
    if(show && !r.tag){ r.tag = document.createElement('div'); r.tag.className = 'ptag'; document.body.appendChild(r.tag); }
    if(r.tag){
      r.tag.style.display = show ? 'block' : 'none';
      if(show){ r.tag.style.left = sx + 'px'; r.tag.style.top = sy + 'px'; if(r.tag.textContent !== r.n) r.tag.textContent = r.n; }
    }
  }
}

let last = performance.now(), animT = 0;
function frame(now){
  refreshTab();
  const dt = (dead || !started || paused) ? 0 : Math.min((now - last)/1000, 0.1); last = now;

  let fx = (down('forward')?1:0) - (down('back')?1:0);
  let rx = (down('right')?1:0) - (down('left')?1:0);
  const len = Math.hypot(fx, rx);
  // rivers: wading slows you down and the current carries you downstream
  const wdepth = waterDepthAt(player.x, player.z);
  const waterSlow = wdepth > 1.0 ? 0.45 : wdepth > 0.25 ? 0.7 : 1;
  if(wdepth > 0.1){
    const fw = flowAt(player.x, player.z), push = 1.4 * Math.min(wdepth, 1.2) * dt;
    const px = player.x + fw[0]*push, pz = player.z + fw[1]*push;
    if(canMove(px, pz)){ player.x = px; player.z = pz; }
  }
  if(len){
    const speed = (down('sprint') ? SPRINT : WALK) * waterSlow;
    fx/=len; rx/=len;
    const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
    const nx = player.x + ( s*fx + c*rx) * speed * dt;
    const nz = player.z + (-c*fx + s*rx) * speed * dt;
    // walk if the slope allows it, otherwise try sliding along the hillside
    if(canMove(nx, nz)){ player.x = nx; player.z = nz; }
    else if(canMove(nx, player.z)) player.x = nx;
    else if(canMove(player.x, nz)) player.z = nz;
  }

  if(holding && punch.t >= 1){ punch.t = 0; punch.hit = false; }
  if(punch.t < 1){
    punch.t += dt / PUNCH_TIME;
    if(!punch.hit && punch.t >= 0.5){ punch.hit = true; doPunch(); }
  }

  updateMonsters(dt);
  updatePickup(dt);
  updateMP();

  let jumping = false;
  if(down('jump') && player.grounded){ player.vy = JUMP; player.grounded = false; jumping = true; player.airPeak = player.y; }
  player.vy -= GRAVITY * dt;
  player.y += player.vy * dt;
  const ground = groundAt(player.x, player.z);
  if(player.y <= ground){
    if(!player.grounded){                       // just landed: hurt by long falls, unless it was into deep water
      const fall = player.airPeak - ground;
      if(fall > FALL_SAFE && waterDepthAt(player.x, player.z) < 0.5) hurt(Math.round((fall - FALL_SAFE) * FALL_DMG));
    }
    player.y = ground; player.vy = 0; player.grounded = true;
  }
  else if(!jumping && player.grounded && player.y - ground < 0.4){ player.y = ground; player.vy = 0; }
  else {
    if(player.grounded) player.airPeak = player.y;     // stepped off a ledge: start measuring the fall
    player.grounded = false;
    if(player.y > player.airPeak) player.airPeak = player.y;
  }

  const cx = player.x, cy = player.y + EYE, cz = player.z;
  const sy = Math.sin(player.yaw), cyw = Math.cos(player.yaw);
  const sp = Math.sin(player.pitch), cp = Math.cos(player.pitch);
  const aspect = canvas.width / canvas.height;

  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  // pass 1: terrain + sky (also writes depth so blades hide behind hills)
  gl.useProgram(prog);
  gl.bindVertexArray(quadVAO);
  gl.depthFunc(gl.ALWAYS);
  crackData.fill(0);
  cracks.forEach((k, i) => { crackData[i*3] = k.x; crackData[i*3+1] = k.z; crackData[i*3+2] = k.seed; });
  const sun = sunDir();
  gl.uniform3f(uSun, sun[0], sun[1], sun[2]);
  gl.uniform3fv(uCr, crackData);
  gl.uniform1i(uNC, cracks.length);
  if(!paused) animT += (now - (frame.prev || now))/1000;
  frame.prev = now;
  gl.uniform1f(uTime, animT);
  gl.uniform1f(uFast, fastMode ? 1 : 0);
  const fwdX = sy*cp, fwdY = sp, fwdZ = -cyw*cp, fOn = flashOn ? 1 : 0;
  gl.uniform4f(uFlash, fwdX, fwdY, fwdZ, fOn);
  gl.uniform3f(uPos, cx, cy, cz);
  gl.uniform1f(uYaw, player.yaw);
  gl.uniform1f(uPitch, player.pitch);
  gl.uniform1f(uAspect, aspect);
  gl.uniform1f(uTan, TANH);
  gl.uniform1f(uPix, 2*TANH/canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // pass 2: 3D grass blades (skipped in fast mode)
  if(!fastMode){
  gl.useProgram(bprog);
  gl.bindVertexArray(emptyVAO);
  gl.depthFunc(gl.LEQUAL);
  gl.uniform3f(bSun, sun[0], sun[1], sun[2]);
  gl.uniform3fv(bCr, crackData);
  gl.uniform1i(bNC, cracks.length);
  gl.uniform3f(bCam, cx, cy, cz);
  gl.uniform3f(bR, cyw, 0, sy);
  gl.uniform3f(bU, -sy*sp, cp, cyw*sp);
  gl.uniform3f(bF,  sy*cp, sp, -cyw*cp);
  gl.uniform1f(bTan, TANH);
  gl.uniform1f(bAsp, aspect);
  gl.uniform1f(bTime, animT);
  gl.uniform4f(bFlash, fwdX, fwdY, fwdZ, fOn);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 7, BLADE_G*BLADE_G);
  }

  // pass 2b: monsters
  if(monsters.length || worldSwords.length){
    gl.useProgram(mprog);
    gl.bindVertexArray(fistVAO);
    gl.uniform3f(mSun, sun[0], sun[1], sun[2]);
    gl.uniform4f(mFlash, fwdX, fwdY, fwdZ, fOn);
    gl.uniform3f(mCam, cx, cy, cz);
    gl.uniform3f(mR, cyw, 0, sy);
    gl.uniform3f(mUp, -sy*sp, cp, cyw*sp);
    gl.uniform3f(mF,  sy*cp, sp, -cyw*cp);
    gl.uniform1f(mTan, TANH);
    gl.uniform1f(mAsp, aspect);
    drawSwords(sun);
    drawPlayers(sun);
    drawMonsters();
  }

  updateTags(cx, cy, cz, [cyw, 0, sy], [-sy*sp, cp, cyw*sp], [sy*cp, sp, -cyw*cp], aspect);
  updateBars(cx, cy, cz, [cyw, 0, sy], [-sy*sp, cp, cyw*sp], [sy*cp, sp, -cyw*cp], aspect);

  // pass 3: the fist, on top of everything
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.depthFunc(gl.LESS);
  gl.useProgram(fprog);
  gl.bindVertexArray(fistVAO);
  gl.uniform1f(fTan, TANH);
  gl.uniform1f(fAsp, aspect);
  const e = punchE(Math.min(punch.t, 1));
  const fxp = 0.30 - 0.22*e, fyp = -0.28 + 0.14*e, fzp = 0.55 + 0.60*e;
  const box = (ox, oy, oz, sx, sy, sz, r, g, b) => {
    gl.uniform3f(fOff, ox, oy, oz); gl.uniform3f(fSize, sx, sy, sz); gl.uniform3f(fCol, r, g, b);
    gl.drawArrays(gl.TRIANGLES, 0, 36);
  };
  if(weapon){
    const t = SWORD_TYPES[weapon], b = t.blade, g = t.guard;
    box(fxp + 0.02, fyp,        fzp + 0.30, 0.016, 0.10, 0.80, b[0], b[1], b[2]);   // blade
    box(fxp + 0.02, fyp,        fzp - 0.12, 0.030, 0.24, 0.045, g[0], g[1], g[2]);  // crossguard
    box(fxp + 0.02, fyp,        fzp - 0.26, 0.04,  0.04, 0.22, 0.22, 0.13, 0.08);   // grip
    box(fxp + 0.02, fyp,        fzp - 0.39, 0.06,  0.06, 0.06, g[0], g[1], g[2]);   // pommel
  } else {
    box(fxp + 0.03, fyp - 0.03, fzp - 0.35, 0.15, 0.15, 0.95, 0.78, 0.82, 0.88);  // smooth rectangular prism
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
