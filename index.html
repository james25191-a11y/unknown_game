<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flat World</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------------------------------------------------------------------
// Terrain: a tiling heightmap generated here in JS. The same data is uploaded
// to the GPU for drawing and read by the physics, so what you see is what you
// stand on. The world repeats every PERIOD metres, so it never ends.
// ---------------------------------------------------------------------------
const PERIOD = 1536, N = 1024, CELL = PERIOD / N;

function hash2(ix, iz){
  let n = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function pnoise(x, z, cells, seed){
  const u = x / PERIOD * cells, v = z / PERIOD * cells;
  const iu = Math.floor(u), iv = Math.floor(v);
  let fu = u - iu, fv = v - iv;
  fu = fu*fu*(3 - 2*fu); fv = fv*fv*(3 - 2*fv);
  const a = ((iu % cells) + cells) % cells, b = (a + 1) % cells;
  const c = ((iv % cells) + cells) % cells, d = (c + 1) % cells;
  const s = seed * 7919;
  const n00 = hash2(a+s, c), n10 = hash2(b+s, c), n01 = hash2(a+s, d), n11 = hash2(b+s, d);
  const x0 = n00 + (n10 - n00)*fu, x1 = n01 + (n11 - n01)*fu;
  return x0 + (x1 - x0)*fv;
}
function fbm(x, z, cells, oct, seed){
  let sum = 0, amp = 0.5, norm = 0;
  for(let i = 0; i < oct; i++){
    sum += pnoise(x, z, cells << i, seed + i) * amp; norm += amp; amp *= 0.5;
  }
  return sum / norm;
}
function ridged(x, z, cells, oct, seed){
  let sum = 0, amp = 0.5, norm = 0;
  for(let i = 0; i < oct; i++){
    const q = 2*pnoise(x, z, cells << i, seed + i) - 1;
    const r = 1 - Math.sqrt(q*q + 0.03);   // soft crest instead of a razor crease
    sum += r*amp; norm += amp; amp *= 0.5;
  }
  return sum / norm;
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a)/(b - a), 0), 1); return t*t*(3 - 2*t); };

let lastRock = 0;   // height contributed by rock outcrops at the last sample

// scattered boulders / outcrops jutting from the ground (one candidate per 24 m cell)
function rocks(x, z){
  const RC = 64, cs = PERIOD / RC;
  const cx = Math.floor(x/cs), cz = Math.floor(z/cs);
  let best = 0;
  for(let i = -1; i <= 1; i++) for(let j = -1; j <= 1; j++){
    const ix = cx + i, iz = cz + j;
    const wi = ((ix % RC) + RC) % RC, wj = ((iz % RC) + RC) % RC;
    if(hash2(wi + 500, wj) < 0.5) continue;
    const px = (ix + 0.15 + 0.7*hash2(wi + 600, wj)) * cs;
    const pz = (iz + 0.15 + 0.7*hash2(wi + 700, wj)) * cs;
    const q  = hash2(wi + 800, wj);
    const rad = 1.8 + 4.2*q*q;
    const dx = x - px, dz = z - pz;
    const d2 = (dx*dx + dz*dz) / (rad*rad);
    if(d2 >= 1) continue;
    const hgt = (0.8 + 3.2*q) * Math.pow(1 - d2, 0.55) * (0.6 + 0.8*pnoise(x, z, 512, 9));
    if(hgt > best) best = hgt;
  }
  return best;
}

function terrainH(x, z){
  const dx = x - PERIOD*Math.round(x/PERIOD), dz = z - PERIOD*Math.round(z/PERIOD);
  const r = Math.hypot(dx, dz);

  // broad swells, mid-size lumps and small bumps
  let h = (fbm(x, z, 8, 3, 1) - 0.5)*22 + (fbm(x, z, 24, 2, 2) - 0.5)*7 + (fbm(x, z, 96, 2, 6) - 0.5)*1.6;

  // hollows: round indents with sloping sides
  h -= 4.5 * sstep(0.60, 0.78, pnoise(x, z, 20, 7)) * (0.6 + 0.4*pnoise(x, z, 64, 8));

  // terraced ground: flat shelves joined by slanted risers, in some regions
  const tmask = sstep(0.42, 0.62, fbm(x, z, 3, 2, 10));
  const s = (fbm(x, z, 14, 2, 11) - 0.5) * 20;
  const fl = Math.floor(s);
  h += tmask * 1.3 * (fl + sstep(0.30, 0.70, s - fl));

  // mountains rise in a broken ring around the start; the start itself is meadow
  const ring  = sstep(80, 230, r);
  const clump = sstep(0.30, 0.50, fbm(x, z, 3, 2, 3));
  const mask  = ring * (0.3 + 0.7*clump);
  const shape = sstep(0.64, 0.88, ridged(x, z, 6, 3, 4));
  const foot  = ring * (fbm(x, z, 5, 3, 5) - 0.2) * 28;
  // valleys: winding channels with a flat floor and sloping walls; they also cut passes through the mountains
  const vd = Math.abs(fbm(x, z, 4, 3, 20) - 0.5);
  const vwarp = (pnoise(x, z, 24, 21) - 0.5) * 0.012;          // wobble the walls so they aren't uniform
  const valley = 1 - sstep(0.012, 0.075, vd + vwarp);
  h = h - valley*11 + (mask*shape*120 + foot) * (1 - 0.9*valley);

  // rock outcrops (kept off the spawn point)
  lastRock = rocks(x, z) * sstep(8, 18, r);
  return h + lastRock;
}

const heights = new Float32Array(N*N*2);   // [height, rock] per texel
let maxH = 0;
for(let j = 0; j < N; j++){
  for(let i = 0; i < N; i++){
    const h = terrainH(i*CELL, j*CELL);
    heights[(j*N + i)*2] = h;
    heights[(j*N + i)*2 + 1] = lastRock;
    if(h > maxH) maxH = h;
  }
}

function heightAt(x, z){
  const fx = x / CELL, fz = z / CELL;
  const ix = Math.floor(fx), iz = Math.floor(fz);
  const ax = fx - ix, az = fz - iz;
  const i0 = ix & (N-1), i1 = (ix + 1) & (N-1);
  const j0 = iz & (N-1), j1 = (iz + 1) & (N-1);
  const a = heights[(j0*N + i0)*2], b = heights[(j0*N + i1)*2];
  const c = heights[(j1*N + i0)*2], d = heights[(j1*N + i1)*2];
  const t0 = a + (b - a)*ax, t1 = c + (d - c)*ax;
  return t0 + (t1 - t0)*az;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');

const vs = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p; gl_Position = vec4(p,0.,1.); }`;

const COMMON = `
uniform sampler2D hm;
const float PERIOD = ${PERIOD.toFixed(1)};
const int NN = ${N};
const float CELL = ${CELL.toFixed(4)};
const float NEAR = 0.1, FAR = 4000.0;
const vec3 SUN = normalize(vec3(0.5, 0.42, -0.75));
const vec3 HORIZON = vec3(0.72,0.88,0.98);

float H(vec2 p){
  vec2 f = p * (float(NN) / PERIOD);
  vec2 fl = floor(f), fr = f - fl;
  ivec2 i = ivec2(fl) & ivec2(NN-1);
  float a = texelFetch(hm, i, 0).r;
  float b = texelFetch(hm, (i + ivec2(1,0)) & ivec2(NN-1), 0).r;
  float c = texelFetch(hm, (i + ivec2(0,1)) & ivec2(NN-1), 0).r;
  float d = texelFetch(hm, (i + ivec2(1,1)) & ivec2(NN-1), 0).r;
  return mix(mix(a,b,fr.x), mix(c,d,fr.x), fr.y);
}
// height of rock outcrop at this spot (0 = bare ground)
float R(vec2 p){
  vec2 f = p * (float(NN) / PERIOD);
  vec2 fl = floor(f), fr = f - fl;
  ivec2 i = ivec2(fl) & ivec2(NN-1);
  float a = texelFetch(hm, i, 0).g;
  float b = texelFetch(hm, (i + ivec2(1,0)) & ivec2(NN-1), 0).g;
  float c = texelFetch(hm, (i + ivec2(0,1)) & ivec2(NN-1), 0).g;
  float d = texelFetch(hm, (i + ivec2(1,1)) & ivec2(NN-1), 0).g;
  return mix(mix(a,b,fr.x), mix(c,d,fr.x), fr.y);
}
`;

const fs = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 uv; out vec4 o;

${COMMON}
uniform vec3 pos;
uniform float yaw, pitch, aspect, tanH, pixAng, maxH;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}

vec3 skyCol(vec3 d){
  vec3 zenith = vec3(0.16,0.45,0.85);
  vec3 sky = mix(HORIZON, zenith, pow(clamp(d.y,0.,1.), 0.5));
  float sd = max(dot(d, SUN), 0.);
  sky += vec3(1.0,0.85,0.55) * (pow(sd,6.)*0.12 + pow(sd,48.)*0.35 + pow(sd,400.)*0.6);
  sky = mix(sky, vec3(1.0,0.98,0.9), smoothstep(0.99955, 0.99975, sd));
  return sky;
}

vec3 grass(vec2 g, float w){
  float pat = vnoise(g*0.08)*0.5 + vnoise(g*0.4)*0.3 + vnoise(g*1.7)*0.2;
  float f1 = vnoise(g*vec2(60.,14.))*0.5 + vnoise(vec2(g.x*14., g.y*60.))*0.5;
  float f2 = vnoise(g*vec2(180.,40.))*0.5 + vnoise(vec2(g.x*40., g.y*180.))*0.5;
  float f3 = hash(floor(g*220.));
  float d1 = 1.0 - smoothstep(0.02, 0.12, w);
  float d2 = 1.0 - smoothstep(0.005, 0.04, w);
  float tone = pat*0.75 + (f1-0.5)*0.7*d1 + (f2-0.5)*0.5*d2 + (f3-0.5)*0.35*d2;
  vec3 dark  = vec3(0.10,0.28,0.07);
  vec3 mid   = vec3(0.24,0.50,0.13);
  vec3 light = vec3(0.50,0.72,0.22);
  vec3 c = mix(dark, mid, smoothstep(0.1,0.5,tone));
  c = mix(c, light, smoothstep(0.5,0.95,tone));
  c = mix(c, vec3(0.55,0.55,0.22), smoothstep(0.62,0.9,vnoise(g*0.25))*0.25);
  return c;
}

vec3 rock(vec3 p, float w){
  float fine = 1.0 - smoothstep(0.02, 0.2, w);
  float st = vnoise(vec2((p.x+p.z)*0.22, p.y*1.5))*0.5
           + vnoise(vec2(p.x*0.7 + p.y*0.5, p.z*0.7 - p.y*0.5))*0.3
           + (vnoise(vec2(p.x*3.1 + p.y*2.3, p.z*3.1 - p.y*1.9)) - 0.5)*0.4*fine
           + (hash(floor(vec2(p.x+p.z, p.y)*14.)) - 0.5)*0.25*fine
           + 0.1;
  vec3 darkRock  = vec3(0.20,0.18,0.17);
  vec3 lightRock = vec3(0.60,0.54,0.47);
  return mix(darkRock, lightRock, clamp(st,0.,1.));
}

void main(){
  vec3 up = vec3(0.,1.,0.);
  vec3 f = vec3(sin(yaw),0.,-cos(yaw));
  vec3 r = vec3(cos(yaw),0.,sin(yaw));
  vec3 F = f*cos(pitch) + up*sin(pitch);
  vec3 U = -f*sin(pitch) + up*cos(pitch);
  vec3 d = normalize(F + r*uv.x*tanH*aspect + U*uv.y*tanH);

  vec3 ro = pos;
  float t = 0.3, tp = 0.3;
  bool hit = false;
  for(int i = 0; i < 280; i++){
    vec3 p = ro + d*t;
    float hh = p.y - H(p.xz);
    if(hh < 0.0){ hit = true; break; }
    if(d.y > 0.0 && p.y > maxH) break;
    tp = t;
    t += max(hh*0.45, 0.035*t + 0.1);
    if(t > 2600.0) break;
  }

  vec3 col;
  if(!hit){
    col = skyCol(d);
    gl_FragDepth = 1.0;
  } else {
    float lo = tp, hi = t;
    for(int i = 0; i < 7; i++){
      float mid = 0.5*(lo+hi);
      vec3 q = ro + d*mid;
      if(q.y - H(q.xz) < 0.0) hi = mid; else lo = mid;
    }
    t = hi;
    vec3 p = ro + d*t;
    float e = CELL;
    vec3 n = normalize(vec3(H(p.xz - vec2(e,0.)) - H(p.xz + vec2(e,0.)), 2.*e,
                            H(p.xz - vec2(0.,e)) - H(p.xz + vec2(0.,e))));
    float w = t*pixAng / max(abs(dot(n,d)), 0.04);

    float zv = dot(p - ro, F);
    gl_FragDepth = ((FAR+NEAR)/(FAR-NEAR) - 2.*FAR*NEAR/((FAR-NEAR)*zv))*0.5 + 0.5;

    float steep = 1.0 - n.y;
    float rk = max(max(smoothstep(0.10, 0.26, steep), smoothstep(45., 85., p.y)), smoothstep(0.03, 0.35, R(p.xz)));
    vec3 alb = mix(grass(p.xz, w), rock(p, w), rk);

    float sunL = max(dot(n, SUN), 0.);
    vec3 amb = vec3(0.50,0.62,0.85) * (0.30 + 0.25*n.y);
    col = alb * (amb + vec3(1.0,0.92,0.78)*sunL*0.95);

    float fog = 1.0 - exp(-t*0.0014);
    vec3 haze = HORIZON + vec3(1.0,0.85,0.55)*pow(max(dot(d,SUN),0.),8.)*0.15;
    col = mix(col, haze, clamp(fog,0.,1.));
  }
  o = vec4(col,1.);
}`;


// ---- 3D grass blades: instanced, placed on a world-fixed grid around the player ----
const BLADE_CELL = 0.2, BLADE_G = 260;
const bvs = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
${COMMON}
uniform vec3 camPos, cR, cU, cF;
uniform float tanH, aspect, time;
out vec3 vCol;

const int G = ${BLADE_G};
const float CS = ${BLADE_CELL.toFixed(3)};
const float TY[4] = float[4](0.0, 0.35, 0.70, 1.0);
const float TW[4] = float[4](1.0, 0.85, 0.50, 0.0);

float hh(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }

void main(){
  int id = gl_InstanceID;
  vec2 cell = floor(camPos.xz / CS) - float(G/2) + vec2(float(id % G), float(id / G));
  vec2 cw = mod(cell, 4096.0);
  float h1 = hh(cw), h2 = hh(cw + 17.3), h3 = hh(cw + 41.7), h4 = hh(cw + 73.1), h5 = hh(cw + 101.9);

  vec2 xz = (cell + vec2(h1, h2)) * CS;
  float dist = length(xz - camPos.xz);
  float lod = 1.0 - smoothstep(18.0, 25.0, dist);
  float y0 = H(xz);

  // only on gentle, low ground (matches where the terrain shader paints grass)
  float e = 0.75;
  vec3 n = normalize(vec3(H(xz - vec2(e,0.)) - H(xz + vec2(e,0.)), 2.*e,
                          H(xz - vec2(0.,e)) - H(xz + vec2(0.,e))));
  float rk = max(max(smoothstep(0.10, 0.26, 1.0 - n.y), smoothstep(45., 85., y0)), smoothstep(0.03, 0.35, R(xz)));
  lod *= 1.0 - smoothstep(0.3, 0.9, rk);
  lod *= smoothstep(0.04, 0.16, h3);          // a few bare patches

  if(lod < 0.01){ gl_Position = vec4(2.,2.,2.,1.); vCol = vec3(0.); return; }

  int vid = gl_VertexID;
  int lv = min(vid/2, 3);
  float side = (vid % 2 == 0) ? -1.0 : 1.0;
  float t = TY[lv], w = TW[lv];

  float ang = h4 * 6.2832;
  vec2 sv = vec2(cos(ang), sin(ang));
  vec2 fw = vec2(-sin(ang), cos(ang));
  float height = (0.28 + 0.55*h5*h5 + 0.12*h2) * lod;
  float width  = 0.034 * (0.8 + 0.6*h3) * lod;
  float bend   = (0.12 + 0.5*h2) * height;
  float sway   = sin(time*1.7 + xz.x*0.35 + xz.y*0.27) * 0.07 * height;

  vec3 pos = vec3(xz.x, y0 - 0.05, xz.y);
  pos.xz += sv * side * w * width + fw * (bend + sway) * t * t;
  pos.y  += height * t - 0.25 * bend * t * t;

  vec3 baseC = mix(vec3(0.06,0.18,0.04), vec3(0.18,0.42,0.08), h1);
  vec3 tipC  = mix(vec3(0.34,0.58,0.13), vec3(0.62,0.74,0.24), h2);
  vec3 col = mix(baseC, tipC, pow(t, 0.8));
  col = mix(col, vec3(0.58,0.54,0.20), step(0.92, fract(h1*7.3)) * t);   // dry blades

  vec3 nn = normalize(vec3(fw.x*0.5, 1.0, fw.y*0.5));
  float sunL = max(dot(nn, SUN), 0.0)*0.7 + 0.25;
  vec3 amb = vec3(0.50,0.62,0.85) * (0.30 + 0.25*n.y) * (0.35 + 0.65*t);   // darker at the roots
  vec3 lit = col * (amb + vec3(1.0,0.92,0.78) * sunL * (0.4 + 0.6*t) * 0.95);
  float fog = 1.0 - exp(-dist*0.0014);
  vCol = mix(lit, HORIZON, clamp(fog, 0., 1.));

  vec3 rel = pos - camPos;
  float zv = dot(rel, cF), xv = dot(rel, cR), yv = dot(rel, cU);
  gl_Position = vec4(xv/(tanH*aspect), yv/tanH,
                     (FAR+NEAR)/(FAR-NEAR)*zv - 2.*FAR*NEAR/(FAR-NEAR), zv);
}`;
const bfs = `#version 300 es
precision highp float;
in vec3 vCol; out vec4 o;
void main(){ o = vec4(vCol, 1.0); }`;

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);

const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const emptyVAO = gl.createVertexArray();
const bprog = gl.createProgram();
gl.attachShader(bprog, sh(gl.VERTEX_SHADER, bvs));
gl.attachShader(bprog, sh(gl.FRAGMENT_SHADER, bfs));
gl.linkProgram(bprog);
if(!gl.getProgramParameter(bprog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(bprog);
const BU = n => gl.getUniformLocation(bprog, n);
const bCam=BU('camPos'), bR=BU('cR'), bU=BU('cU'), bF=BU('cF'),
      bTan=BU('tanH'), bAsp=BU('aspect'), bTime=BU('time');
gl.useProgram(bprog); gl.uniform1i(BU('hm'), 0);
gl.useProgram(prog);

// ---- first-person fist: a few lit boxes drawn in view space ----
const fvs = `#version 300 es
in vec3 a; in vec3 nrm;
uniform vec3 off, size, col;
uniform float tanH, aspect;
out vec3 vC;
void main(){
  vec3 v = off + a*size;
  float n = 0.02, f = 20.0;
  gl_Position = vec4(v.x/(tanH*aspect), v.y/tanH, (f+n)/(f-n)*v.z - 2.*f*n/(f-n), v.z);
  vec3 L = normalize(vec3(-0.35, 0.8, -0.45));
  vC = col * (max(dot(nrm, L), 0.0)*0.7 + 0.38);
}`;
const ffs = `#version 300 es
precision highp float;
in vec3 vC; out vec4 o;
void main(){ o = vec4(vC, 1.0); }`;
const fprog = gl.createProgram();
gl.attachShader(fprog, sh(gl.VERTEX_SHADER, fvs));
gl.attachShader(fprog, sh(gl.FRAGMENT_SHADER, ffs));
gl.bindAttribLocation(fprog, 0, 'a');
gl.bindAttribLocation(fprog, 1, 'nrm');
gl.linkProgram(fprog);
if(!gl.getProgramParameter(fprog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(fprog);
const FU = n => gl.getUniformLocation(fprog, n);
const fOff=FU('off'), fSize=FU('size'), fCol=FU('col'), fTan=FU('tanH'), fAsp=FU('aspect');
const cube = [];
for(let ax = 0; ax < 3; ax++) for(const sg of [-1, 1]){
  const u = (ax+1)%3, v = (ax+2)%3;
  const q = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([su,sv]) => {
    const p = [0,0,0]; p[ax] = 0.5*sg; p[u] = 0.5*su; p[v] = 0.5*sv; return p;
  });
  const nrm = [0,0,0]; nrm[ax] = sg;
  for(const k of [0,1,2,0,2,3]) cube.push(...q[k], ...nrm);
}
const fistVAO = gl.createVertexArray();
gl.bindVertexArray(fistVAO);
const fbuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, fbuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(cube), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
gl.bindVertexArray(null);

const tex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, N, N, 0, gl.RG, gl.FLOAT, heights);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

const U = n => gl.getUniformLocation(prog, n);
const uPos=U('pos'), uYaw=U('yaw'), uPitch=U('pitch'), uAspect=U('aspect'),
      uTan=U('tanH'), uPix=U('pixAng'), uMax=U('maxH');
gl.uniform1i(U('hm'), 0);
gl.uniform1f(uMax, maxH + 1);

const FOV = 75 * Math.PI/180, TANH = Math.tan(FOV/2);
function resize(){
  // cap the pixel count: every pixel marches a ray across the terrain
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.min(dpr, Math.sqrt(1.5e6/(innerWidth*innerHeight)), 1.5);
  canvas.width  = Math.max(2, Math.round(innerWidth*scale));
  canvas.height = Math.max(2, Math.round(innerHeight*scale));
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------------
const EYE = 1.7, WALK = 4, SPRINT = 8;
const GRAVITY = 22, JUMP = 8, MAX_SLOPE = 1.3; // 1.3 ≈ 52° — steeper is a cliff
const player = {x:0, z:0, yaw:0, pitch:0, y:heightAt(0,0), vy:0, grounded:true};
const keys = {};
addEventListener('keydown', e => {
  if(e.code === 'Space') e.preventDefault();
  keys[e.code] = true;
});
addEventListener('keyup',   e => { keys[e.code] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });

canvas.addEventListener('click', () => { if(document.pointerLockElement !== canvas) canvas.requestPointerLock(); });
let holding = false;
addEventListener('mousedown', e => { if(e.button === 0 && document.pointerLockElement === canvas) holding = true; });
addEventListener('mouseup',   e => { if(e.button === 0) holding = false; });
document.addEventListener('pointerlockchange', () => { if(document.pointerLockElement !== canvas) holding = false; });
addEventListener('mousemove', e => {
  if(document.pointerLockElement !== canvas) return;
  player.yaw   += e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
});

function canMove(nx, nz){
  const dist = Math.hypot(nx - player.x, nz - player.z);
  return heightAt(nx, nz) - player.y <= Math.max(0.03, dist*MAX_SLOPE);
}

// ---- punching: each hit digs the terrain; rocks are worn away first ----
const REACH = 4.5, DIG_R = 2.2, DIG_DEPTH = 0.55, MIN_H = -60;
const punch = {t: 1, hit: true};

function dig(px, pz){
  px = ((px % PERIOD) + PERIOD) % PERIOD;
  pz = ((pz % PERIOD) + PERIOD) % PERIOD;
  const i0 = Math.floor((px - DIG_R)/CELL), i1 = Math.ceil((px + DIG_R)/CELL);
  const j0 = Math.floor((pz - DIG_R)/CELL), j1 = Math.ceil((pz + DIG_R)/CELL);
  for(let j = j0; j <= j1; j++) for(let i = i0; i <= i1; i++){
    const d = Math.hypot(i*CELL - px, j*CELL - pz);
    if(d >= DIG_R) continue;
    const c = Math.cos(Math.PI*0.5*d/DIG_R);
    const amt = DIG_DEPTH * c*c;
    const k = (((j & (N-1))*N) + (i & (N-1))) * 2;
    const rock = heights[k+1];
    const fromRock = Math.min(rock, amt);       // rock crumbles first...
    heights[k+1] = rock - fromRock;
    heights[k] = Math.max(MIN_H, heights[k] - amt);   // ...then the ground below goes too
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.RG, gl.FLOAT, heights);
}

function doPunch(){
  const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
  const sp = Math.sin(player.pitch), cp = Math.cos(player.pitch);
  const dx = s*cp, dy = sp, dz = -c*cp;
  const ox = player.x, oy = player.y + EYE, oz = player.z;
  for(let t = 0.2; t <= REACH; t += 0.08){
    const x = ox + dx*t, y = oy + dy*t, z = oz + dz*t;
    if(y < heightAt(x, z)){ dig(x, z); return; }
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, 0.1); last = now;

  let fx = (keys.KeyW?1:0) - (keys.KeyS?1:0);
  let rx = (keys.KeyD?1:0) - (keys.KeyA?1:0);
  const len = Math.hypot(fx, rx);
  if(len){
    const speed = (keys.ShiftLeft || keys.ShiftRight) ? SPRINT : WALK;
    fx/=len; rx/=len;
    const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
    const nx = player.x + ( s*fx + c*rx) * speed * dt;
    const nz = player.z + (-c*fx + s*rx) * speed * dt;
    // walk if the slope allows it, otherwise try sliding along the hillside
    if(canMove(nx, nz)){ player.x = nx; player.z = nz; }
    else if(canMove(nx, player.z)) player.x = nx;
    else if(canMove(player.x, nz)) player.z = nz;
  }

  if(holding && punch.t >= 1){ punch.t = 0; punch.hit = false; }
  if(punch.t < 1){
    punch.t += dt / 0.30;
    if(!punch.hit && punch.t >= 0.45){ punch.hit = true; doPunch(); }
  }

  let jumping = false;
  if(keys.Space && player.grounded){ player.vy = JUMP; player.grounded = false; jumping = true; }
  player.vy -= GRAVITY * dt;
  player.y += player.vy * dt;
  const ground = heightAt(player.x, player.z);
  if(player.y <= ground){ player.y = ground; player.vy = 0; player.grounded = true; }
  else if(!jumping && player.grounded && player.y - ground < 0.4){ player.y = ground; player.vy = 0; }
  else player.grounded = false;

  const cx = player.x, cy = player.y + EYE, cz = player.z;
  const sy = Math.sin(player.yaw), cyw = Math.cos(player.yaw);
  const sp = Math.sin(player.pitch), cp = Math.cos(player.pitch);
  const aspect = canvas.width / canvas.height;

  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  // pass 1: terrain + sky (also writes depth so blades hide behind hills)
  gl.useProgram(prog);
  gl.bindVertexArray(quadVAO);
  gl.depthFunc(gl.ALWAYS);
  gl.uniform3f(uPos, cx, cy, cz);
  gl.uniform1f(uYaw, player.yaw);
  gl.uniform1f(uPitch, player.pitch);
  gl.uniform1f(uAspect, aspect);
  gl.uniform1f(uTan, TANH);
  gl.uniform1f(uPix, 2*TANH/canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // pass 2: 3D grass blades
  gl.useProgram(bprog);
  gl.bindVertexArray(emptyVAO);
  gl.depthFunc(gl.LEQUAL);
  gl.uniform3f(bCam, cx, cy, cz);
  gl.uniform3f(bR, cyw, 0, sy);
  gl.uniform3f(bU, -sy*sp, cp, cyw*sp);
  gl.uniform3f(bF,  sy*cp, sp, -cyw*cp);
  gl.uniform1f(bTan, TANH);
  gl.uniform1f(bAsp, aspect);
  gl.uniform1f(bTime, now/1000);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 7, BLADE_G*BLADE_G);

  // pass 3: the fist, on top of everything
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.depthFunc(gl.LESS);
  gl.useProgram(fprog);
  gl.bindVertexArray(fistVAO);
  gl.uniform1f(fTan, TANH);
  gl.uniform1f(fAsp, aspect);
  const e = Math.sin(Math.PI * Math.min(punch.t, 1));
  const fxp = 0.30 - 0.22*e, fyp = -0.28 + 0.14*e, fzp = 0.55 + 0.60*e;
  const box = (ox, oy, oz, sx, sy, sz, r, g, b) => {
    gl.uniform3f(fOff, ox, oy, oz); gl.uniform3f(fSize, sx, sy, sz); gl.uniform3f(fCol, r, g, b);
    gl.drawArrays(gl.TRIANGLES, 0, 36);
  };
  box(fxp + 0.03, fyp - 0.03, fzp - 0.35, 0.15, 0.15, 0.95, 0.78, 0.82, 0.88);  // smooth rectangular prism

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
